<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Google 1998</title>
  <style>
    /* ── Basic Reset & Fonts ─────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      color: #222;
      min-height: 100vh;
    }

    /* ── Header / Logo Area ──────────────────────────── */
    header {
      background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 50%, #6a1b9a 100%);
      padding: 28px 20px 24px;
      text-align: center;
    }

    /* Colourful "Mini Google 1998" logo text */
    .logo {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 6px;
    }
    .logo span:nth-child(1) { color: #fbbc04; }
    .logo span:nth-child(2) { color: #ea4335; }
    .logo span:nth-child(3) { color: #34a853; }
    .logo span:nth-child(4) { color: #4285f4; }
    .logo span:nth-child(5) { color: #ea4335; }
    .logo span:nth-child(6) { color: #fbbc04; }
    .logo .year {
      color: #fff;
      font-size: 1rem;
      font-weight: 400;
      vertical-align: super;
      margin-left: 4px;
    }
    .tagline {
      color: #cce0ff;
      font-size: 0.85rem;
      margin-bottom: 18px;
    }

    /* ── Search Box ──────────────────────────────────── */
    .search-row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    #searchBox {
      width: 320px;
      padding: 10px 16px;
      border-radius: 24px;
      border: none;
      font-size: 1rem;
      outline: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    #searchBtn {
      padding: 10px 22px;
      border-radius: 24px;
      border: none;
      background: #fbbc04;
      color: #111;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: background 0.2s;
    }
    #searchBtn:hover { background: #f9a825; }

    /* ── Example Buttons ─────────────────────────────── */
    .examples {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .example-btn {
      padding: 6px 18px;
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .example-btn:hover { background: rgba(255,255,255,0.3); }

    /* ── Main Content Area ───────────────────────────── */
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

    /* ── Toolbar (Run surfer button + status) ────────── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    #surferBtn {
      padding: 8px 20px;
      border-radius: 20px;
      border: none;
      background: #6a1b9a;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    #surferBtn:hover { background: #4a148c; }
    #surferStatus {
      font-size: 0.85rem;
      color: #555;
      font-style: italic;
    }

    /* ── Two-column results layout ───────────────────── */
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 680px) {
      .results-grid { grid-template-columns: 1fr; }
    }
    .col-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 14px;
      padding-bottom: 6px;
      border-bottom: 3px solid;
    }
    .col-old .col-title  { color: #1a73e8; border-color: #1a73e8; }
    .col-surf .col-title { color: #6a1b9a; border-color: #6a1b9a; }

    /* ── Result Card ─────────────────────────────────── */
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-left: 4px solid transparent;
      transition: box-shadow 0.2s;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.14); }
    .col-old  .card { border-color: #1a73e8; }
    .col-surf .card { border-color: #6a1b9a; }

    .card-rank {
      font-size: 0.75rem;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .card-url {
      font-size: 0.92rem;
      color: #1a73e8;
      font-weight: 700;
      margin-bottom: 6px;
      word-break: break-all;
    }
    .card-text {
      font-size: 0.88rem;
      color: #333;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    /* Highlighted search word */
    .card-text mark {
      background: #fff176;
      color: #333;
      border-radius: 2px;
      padding: 0 2px;
    }
    .card-score {
      font-size: 0.82rem;
      color: #555;
    }
    .score-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.82rem;
    }
    .badge-old  { background: #e3f2fd; color: #1a73e8; }
    .badge-surf { background: #f3e5f5; color: #6a1b9a; }
    .badge-links { background: #e8f5e9; color: #2e7d32; }

    /* ── No results message ──────────────────────────── */
    .no-results {
      text-align: center;
      padding: 40px;
      font-size: 1.05rem;
      color: #555;
      grid-column: 1 / -1;
    }
    .no-results .emoji { font-size: 3rem; display: block; margin-bottom: 10px; }

    /* ── Empty state (before first search) ──────────── */
    #emptyState {
      text-align: center;
      padding: 40px;
      color: #888;
    }
    #emptyState .big { font-size: 2.5rem; }

  </style>
</head>
<body>

<!-- ════════════════════════════════════════════════════
     HEADER: Logo, search box, example buttons
════════════════════════════════════════════════════ -->
<header>
  <!-- Colourful logo: each letter gets its own colour -->
  <div class="logo">
    <span>M</span><span>i</span><span>n</span><span>i</span>
    &nbsp;
    <span>G</span><span>o</span><span style="color:#fbbc04">o</span><span style="color:#4285f4">g</span><span style="color:#ea4335">l</span><span style="color:#34a853">e</span>
    <span class="year">1998</span>
  </div>
  <div class="tagline">Old way vs. Random Surfer — feel the difference!</div>

  <!-- Search box + button -->
  <div class="search-row">
    <input id="searchBox" type="text" placeholder="Search the web…" />
    <button id="searchBtn">Search</button>
  </div>

  <!-- Four handy example buttons -->
  <div class="examples">
    <button class="example-btn" onclick="quickSearch('pizza')">🍕 pizza</button>
    <button class="example-btn" onclick="quickSearch('cricket')">🏏 cricket</button>
    <button class="example-btn" onclick="quickSearch('movie')">🎬 movie</button>
    <button class="example-btn" onclick="quickSearch('exam')">📝 exam</button>
  </div>
</header>

<!-- ════════════════════════════════════════════════════
     MAIN: Toolbar + Results
════════════════════════════════════════════════════ -->
<main>
  <!-- Toolbar: run-surfer button + status message -->
  <div id="toolbar" style="display:none;">
    <button id="surferBtn" onclick="runSurfer()">🎲 Run the surfer again</button>
    <span id="surferStatus">Surfer scores ready.</span>
  </div>

  <!-- Two-column results area -->
  <div id="resultsArea">
    <!-- Empty state shown before the first search -->
    <div id="emptyState">
      <div class="big">🔍</div>
      <p>Type a word above to search 20 pages from 1998!</p>
    </div>
  </div>
</main>


<script>
/* ════════════════════════════════════════════════════════
   DATA — 20 web pages from the "1998 internet"
   Each page: id, url, text, links_to (array of page ids)
════════════════════════════════════════════════════════ */
const pages = [
  { id:  1, url: "www.pizzapalace.com",      text: "Welcome to Pizza Palace! Order the best pizza online. Our pizza menu has cheese pizza, pepperoni pizza, and garlic pizza. Pizza delivered hot to your door. Pizza lovers unite!",                                links_to: [2, 5, 8] },
  { id:  2, url: "www.italianfood.net",      text: "Italian food guide: pasta, risotto, tiramisu, and of course pizza. The history of pizza goes back to Naples, Italy. A true pizza margherita uses fresh tomato and mozzarella.",                               links_to: [1, 3, 10] },
  { id:  3, url: "www.foodblog.org",         text: "Today we review the top ten restaurants in town. Great pizza, amazing burgers, and spicy tacos. This pizza spot near downtown scored 9 out of 10. Come hungry!",                                             links_to: [1, 2, 7] },
  { id:  4, url: "www.cricketworld.com",     text: "Cricket world: live scores, cricket news, and player stats. Follow every cricket match ball by ball. The cricket world cup is the biggest cricket event on the planet.",                                      links_to: [5, 6, 11] },
  { id:  5, url: "www.sportsnews.net",       text: "Sports news daily. Cricket, football, tennis, and more. Today in cricket: India won the cricket test match. Cricket fans go wild! Also: pizza discount at the stadium food stall.",                           links_to: [4, 6, 12] },
  { id:  6, url: "www.cricketclub.org",      text: "Join the local cricket club! Cricket practice every Saturday. Learn cricket batting, cricket bowling, and cricket fielding. Cricket is a sport for everyone.",                                                links_to: [4, 5] },
  { id:  7, url: "www.boxofficehits.com",    text: "Box office hits of 1998. Top movie rankings, movie trailers, and movie reviews. The best movie this summer is a sci-fi movie everyone is talking about. Watch a movie tonight!",                              links_to: [8, 9, 14] },
  { id:  8, url: "www.moviezone.net",        text: "Movie zone: your guide to every new movie release. Movie stars, movie directors, and movie soundtracks. Rate your favourite movie and win a prize. Pizza and a movie — perfect night!",                       links_to: [7, 9, 3] },
  { id:  9, url: "www.filmcritic.org",       text: "Film critic reviews: this week's best movie is a gripping thriller. Our movie rating system scores each movie out of five stars. The worst movie of the year also reviewed.",                               links_to: [7, 8, 15] },
  { id: 10, url: "www.studenthub.edu",       text: "Student hub: notes, exam tips, and study guides. Prepare for your exam with our free exam practice papers. Exam stress? Read our exam survival guide. Good luck on your exam!",                              links_to: [11, 16, 17] },
  { id: 11, url: "www.studytogether.net",    text: "Study together online. Share exam notes and exam questions with friends. Our exam discussion forum is open 24 hours. Beat exam anxiety with our exam meditation guide.",                                      links_to: [10, 12, 16] },
  { id: 12, url: "www.universitylife.org",   text: "University life blog: classes, clubs, cricket matches on the quad, and late-night pizza study sessions. Exam season survival: sleep, eat, and revise. Cricket or exam? Do both!",                            links_to: [10, 11, 4] },
  { id: 13, url: "www.techdigest.com",       text: "Tech digest 1998: search engines are changing the web. A new way to rank pages is turning the internet upside down. The web is growing fast — over a million pages online!",                                links_to: [14, 15, 18] },
  { id: 14, url: "www.webwizard.net",        text: "Web wizard tutorials: how to build your first webpage. Learn HTML, add links, and put your site online. The web wizard movie section reviews sites about movies and cricket.",                               links_to: [13, 7, 4] },
  { id: 15, url: "www.cybercafe1998.com",    text: "Cyber cafe directory 1998. Find a cafe near you to browse the web. Watch a movie trailer, read cricket scores, or order pizza — all at our cyber cafe kiosk. Web surfing made fun!",                        links_to: [13, 8, 5] },
  { id: 16, url: "www.examprep.edu",         text: "Exam prep centre: past exam papers, exam marking schemes, and exam day advice. Our exam tutors help students ace every exam. Sign up for free exam coaching today.",                                         links_to: [10, 11, 17] },
  { id: 17, url: "www.learnmath.edu",        text: "Learn maths online: algebra, geometry, and statistics. Maths exam tips and maths exam practice tests. Crack the maths exam with confidence. Exam success starts here.",                                      links_to: [10, 16, 18] },
  { id: 18, url: "www.sciencelab.edu",       text: "Science lab resources for students. Physics exam, chemistry exam, and biology exam guides. Watch a movie about space science. Order pizza for your lab group after the exam.",                               links_to: [17, 19, 10] },
  { id: 19, url: "www.randomfun.net",        text: "Random fun: jokes, quizzes, and weird facts. Did you know a cricket ball is harder than it looks? Watch a funny movie clip. Take our pizza topping quiz. No exam required!",                                links_to: [20, 3, 8] },
  { id: 20, url: "www.dailynews1998.com",    text: "Daily news 1998: cricket world cup special report, new movie releases this Friday, exam results published, and the best pizza deal in the city. Stay informed, stay connected.",                             links_to: [4, 7, 10, 1] }
];

/* ════════════════════════════════════════════════════════
   STEP 1: Pre-compute "links in" count for every page.
   (How many other pages link TO each page?)
════════════════════════════════════════════════════════ */
const linksInCount = {};          // { pageId: count }
pages.forEach(p => { linksInCount[p.id] = 0; });
pages.forEach(p => {
  p.links_to.forEach(target => {
    if (linksInCount[target] !== undefined) linksInCount[target]++;
  });
});

/* ════════════════════════════════════════════════════════
   STEP 2: Random Surfer — 100,000 moves.

   Rules:
   - 15% of moves: jump to any random page.
   - 85% of moves: click a random link on the current page.
   - If the page has no links at all, jump to any page.
   Count visits to each page, then divide by 100,000.
════════════════════════════════════════════════════════ */
let surferScores = {};   // { pageId: score_as_percent }

function runSurfer() {
  document.getElementById('surferStatus').textContent = 'Running 100,000 moves…';

  // Give browser a moment to update the text before the heavy loop
  setTimeout(() => {
    const MOVES    = 100_000;
    const BOREDOM  = 0.15;    // 15% chance to jump randomly
    const N        = pages.length;

    // Visit counter for each page
    const visits = {};
    pages.forEach(p => { visits[p.id] = 0; });

    // Start on a random page
    let current = pages[Math.floor(Math.random() * N)];

    for (let i = 0; i < MOVES; i++) {
      visits[current.id]++;    // count this visit

      if (Math.random() < BOREDOM || current.links_to.length === 0) {
        // Bored: jump to any page at random
        current = pages[Math.floor(Math.random() * N)];
      } else {
        // Follow a random link from the current page
        const links  = current.links_to;
        const nextId = links[Math.floor(Math.random() * links.length)];
        current = pages.find(p => p.id === nextId);
      }
    }

    // Convert visit counts to percentages
    surferScores = {};
    pages.forEach(p => {
      surferScores[p.id] = (visits[p.id] / MOVES) * 100;
    });

    document.getElementById('surferStatus').textContent =
      `Surfer finished! 100,000 moves done at ${new Date().toLocaleTimeString()}.`;

    // If there's already a search active, refresh the results
    const word = document.getElementById('searchBox').value.trim();
    if (word) showResults(word);
  }, 50);
}

/* ════════════════════════════════════════════════════════
   STEP 3: Old-way ranking — count whole-word occurrences.
════════════════════════════════════════════════════════ */
function countWord(text, word) {
  // \b means "word boundary" so "pizza" won't match "pizzapalace"
  const regex = new RegExp('\\b' + word + '\\b', 'gi');
  const matches = text.match(regex);
  return matches ? matches.length : 0;
}

/* ════════════════════════════════════════════════════════
   STEP 4: Highlight the search word inside page text.
════════════════════════════════════════════════════════ */
function highlight(text, word) {
  const regex = new RegExp('(\\b' + word + '\\b)', 'gi');
  return text.replace(regex, '<mark>$1</mark>');
}

/* ════════════════════════════════════════════════════════
   STEP 5: Build and display the results.
════════════════════════════════════════════════════════ */
function showResults(word) {
  const w = word.toLowerCase().trim();
  if (!w) return;

  // Find all pages whose text contains the search word
  const matching = pages.filter(p => countWord(p.text, w) > 0);

  const area = document.getElementById('resultsArea');

  if (matching.length === 0) {
    // Friendly no-results message
    area.innerHTML = `
      <div class="no-results">
        <span class="emoji">🤷</span>
        <strong>Hmm, nothing for "${word}"!</strong><br>
        The 1998 internet is small — try pizza, cricket, movie, or exam.
        <br><br>🕸️ Remember: back in 1998 there were only 20 pages on the web. Probably.
      </div>`;
    return;
  }

  // --- Old-way ranking: sort by word count (highest first) ---
  const byWordCount = [...matching].sort((a, b) =>
    countWord(b.text, w) - countWord(a.text, w)
  );

  // --- Surfer-way ranking: sort by surfer score (highest first) ---
  const bySurfer = [...matching].sort((a, b) =>
    (surferScores[b.id] || 0) - (surferScores[a.id] || 0)
  );

  // Build a card for a single result
  function makeCard(page, rank, isSurfer) {
    const count = countWord(page.text, w);
    const score = surferScores[page.id] || 0;
    const lin   = linksInCount[page.id] || 0;

    const scoreHTML = isSurfer
      ? `<span class="score-badge badge-surf">⚡ ${score.toFixed(1)}%</span>
         &nbsp;<span class="score-badge badge-links">🔗 Links in: ${lin}</span>`
      : `<span class="score-badge badge-old">✏️ "${w}" × ${count}</span>`;

    return `
      <div class="card">
        <div class="card-rank">#${rank}</div>
        <div class="card-url">🌐 ${page.url}</div>
        <div class="card-text">${highlight(page.text, w)}</div>
        <div class="card-score">${scoreHTML}</div>
      </div>`;
  }

  // Build both columns
  const oldHTML  = byWordCount.map((p, i) => makeCard(p, i + 1, false)).join('');
  const surfHTML = bySurfer.map((p, i) => makeCard(p, i + 1, true)).join('');

  area.innerHTML = `
    <div class="results-grid">
      <div class="col-old">
        <div class="col-title">📚 Old way (1997) — word count</div>
        ${oldHTML}
      </div>
      <div class="col-surf">
        <div class="col-title">🏄 Surfer way (1998) — random surfer</div>
        ${surfHTML}
      </div>
    </div>`;
}

/* ════════════════════════════════════════════════════════
   EVENT WIRING
════════════════════════════════════════════════════════ */

// Search button click
document.getElementById('searchBtn').addEventListener('click', () => {
  const word = document.getElementById('searchBox').value.trim();
  if (word) {
    document.getElementById('toolbar').style.display = 'flex';
    showResults(word);
  }
});

// Press Enter in the search box
document.getElementById('searchBox').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('searchBtn').click();
});

// Quick-search from example buttons
function quickSearch(word) {
  document.getElementById('searchBox').value = word;
  document.getElementById('toolbar').style.display = 'flex';
  showResults(word);
}

/* ════════════════════════════════════════════════════════
   ON PAGE LOAD: run the surfer once automatically
════════════════════════════════════════════════════════ */
window.addEventListener('load', () => {
  document.getElementById('surferStatus').textContent = 'Running first surfer simulation…';
  runSurfer();
});
</script>
</body>
</html>
